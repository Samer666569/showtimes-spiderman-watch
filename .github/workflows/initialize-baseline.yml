name: Initialize ShowTimes baseline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Capture current event ID keys
        run: python snapshot_baseline.py

      - name: Commit baseline file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add baseline-event-ids.json

          if git diff --cached --quiet; then
            echo "Baseline did not change."
            exit 0
          fi

          git commit -m "Initialize ShowTimes event ID baseline"
          git push
